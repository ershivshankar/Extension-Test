<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteLink — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #050508; min-height: 100vh; }
        .glass {
            background: #11111b;
            border: 1px solid rgba(255,255,255,0.08);
        }
        input:focus { outline: none; border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.2s;
        }
        .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .plan-btn { transition: all 0.2s; cursor: pointer; border: 2px solid transparent; }
        .plan-btn.active-free { border-color: #3b82f6; background: rgba(59,130,246,0.15); }
        .plan-btn.active-premium { border-color: #f59e0b; background: rgba(245,158,11,0.15); }
        .passkey-input { letter-spacing: 0.3em; font-size: 1.1rem; text-align: center; font-weight: 700; }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;">
        <div style="position:absolute;top:-5%;left:-5%;width:45%;height:45%;background:radial-gradient(circle,rgba(59,130,246,0.12),transparent 70%);border-radius:50%;"></div>
        <div style="position:absolute;bottom:-5%;right:-5%;width:45%;height:45%;background:radial-gradient(circle,rgba(139,92,246,0.12),transparent 70%);border-radius:50%;border-radius:50%;"></div>
    </div>

    <div style="position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">

        <!-- Logo -->
        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:64px;height:64px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 32px rgba(99,102,241,0.4);">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
            </div>
            <h1 style="font-size:1.5rem;font-weight:800;color:white;letter-spacing:-0.02em;">RemoteLink</h1>
            <p style="font-size:0.8rem;color:#6b7280;margin-top:4px;">Control your PC from anywhere</p>
        </div>

        <!-- Card -->
        <div class="glass" style="width:100%;max-width:420px;border-radius:24px;padding:36px;">

            <h2 style="font-size:1.3rem;font-weight:700;color:white;margin-bottom:4px;text-align:center;">Welcome Back</h2>
            <p style="font-size:0.8rem;color:#6b7280;text-align:center;margin-bottom:28px;">Sign in to your RemoteLink account</p>

            <!-- Error Banner -->
            <div id="error-box" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:0.78rem;color:#fca5a5;text-align:center;"></div>

            <!-- Plan Selector -->
            <div style="margin-bottom:20px;">
                <label style="font-size:0.72rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:10px;">Account Type</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(0,0,0,0.3);padding:6px;border-radius:14px;border:1px solid rgba(255,255,255,0.05);">
                    <button type="button" id="btn-free" class="plan-btn active-free" onclick="selectPlan('free')" style="padding:10px;border-radius:10px;font-size:0.78rem;font-weight:600;color:white;display:flex;align-items:center;justify-content:center;gap:6px;">
                        <span>🆓</span> Free
                    </button>
                    <button type="button" id="btn-premium" class="plan-btn" onclick="selectPlan('premium')" style="padding:10px;border-radius:10px;font-size:0.78rem;font-weight:600;color:#9ca3af;display:flex;align-items:center;justify-content:center;gap:6px;">
                        <span>⭐</span> Premium
                    </button>
                </div>
            </div>

            <form id="login-form" onsubmit="submitLogin(event)">
                <!-- Email -->
                <div style="margin-bottom:16px;">
                    <label style="font-size:0.72rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com"
                        style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white;font-size:0.9rem;transition:all 0.2s;">
                </div>

                <!-- Password -->
                <div style="margin-bottom:16px;">
                    <label style="font-size:0.72rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" required placeholder="Enter your password"
                            style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white;font-size:0.9rem;transition:all 0.2s;padding-right:48px;">
                        <button type="button" onclick="togglePw()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7280;cursor:pointer;font-size:0.9rem;">👁</button>
                    </div>
                </div>

                <!-- Passkey (Premium only) -->
                <div id="passkey-box" style="display:none;margin-bottom:16px;">
                    <label style="font-size:0.72rem;font-weight:600;color:#f59e0b;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">⭐ 8-Digit Premium Passkey</label>
                    <input type="text" id="passkey" maxlength="8" placeholder="• • • • • • • •"
                        class="passkey-input"
                        style="width:100%;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:12px 16px;color:#fbbf24;font-size:1.1rem;transition:all 0.2s;">
                    <p style="font-size:0.7rem;color:#6b7280;margin-top:6px;">Enter the passkey provided by your administrator after payment.</p>
                </div>

                <!-- Submit -->
                <button type="submit" id="submit-btn" class="btn-primary" style="width:100%;padding:14px;border-radius:12px;border:none;color:white;font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:4px;">
                    Sign In →
                </button>
            </form>

            <div style="text-align:center;margin-top:20px;font-size:0.8rem;color:#6b7280;">
                Don't have an account?
                <a href="/register.html" style="color:#60a5fa;font-weight:500;text-decoration:none;margin-left:4px;">Create one</a>
            </div>
        </div>

        <!-- Footer -->
        <div style="margin-top:24px;font-size:0.65rem;color:#374151;font-family:monospace;letter-spacing:0.1em;text-transform:uppercase;">
            Developed by Shiv Shankar
        </div>
    </div>

    <script>
        const API = 'https://remotelink-relay.onrender.com';
        let selectedPlan = 'free';

        // If already logged in and token is valid, go to dashboard
        (async function() {
            const token = localStorage.getItem('jarvis_token') || localStorage.getItem('token');
            if (token) {
                try {
                    const r = await fetch(API + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (r.ok) return window.location.replace('/dashboard.html');
                } catch(e) {}
                localStorage.removeItem('token');
                localStorage.removeItem('jarvis_token');
            }
        })();

        function selectPlan(plan) {
            selectedPlan = plan;
            const btnFree = document.getElementById('btn-free');
            const btnPremium = document.getElementById('btn-premium');
            const passkeyBox = document.getElementById('passkey-box');
            const passkey = document.getElementById('passkey');

            if (plan === 'free') {
                btnFree.className = 'plan-btn active-free';
                btnFree.style.color = 'white';
                btnPremium.className = 'plan-btn';
                btnPremium.style.color = '#9ca3af';
                passkeyBox.style.display = 'none';
                passkey.removeAttribute('required');
            } else {
                btnFree.className = 'plan-btn';
                btnFree.style.color = '#9ca3af';
                btnPremium.className = 'plan-btn active-premium';
                btnPremium.style.color = 'white';
                passkeyBox.style.display = 'block';
                passkey.setAttribute('required', 'required');
            }
        }

        function togglePw() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = msg;
            box.style.display = 'block';
        }

        async function submitLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passkey = document.getElementById('passkey').value.trim();

            btn.textContent = 'Signing in...';
            btn.disabled = true;

            try {
                const res = await fetch(API + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, passkey, planSelection: selectedPlan })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Login failed. Please check your credentials.');
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('jarvis_token', data.token);
                sessionStorage.setItem('plan_selection', selectedPlan);
                document.cookie = 'token=' + data.token + '; path=/';
                document.cookie = 'jarvis_token=' + data.token + '; path=/';

                window.location.replace('/dashboard.html');
            } catch (err) {
                showError(err.message);
                btn.textContent = 'Sign In →';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
