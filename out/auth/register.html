<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteLink — Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #050508; min-height: 100vh; }
        .glass {
            background: #11111b;
            border: 1px solid rgba(255,255,255,0.08);
        }
        input:focus { outline: none; border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transition: all 0.2s; }
        .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
    </style>
</head>
<body>
    <!-- Ambient Background -->
    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;">
        <div style="position:absolute;top:-5%;left:-5%;width:45%;height:45%;background:radial-gradient(circle,rgba(59,130,246,0.12),transparent 70%);border-radius:50%;"></div>
        <div style="position:absolute;bottom:-5%;right:-5%;width:45%;height:45%;background:radial-gradient(circle,rgba(139,92,246,0.12),transparent 70%);border-radius:50%;"></div>
    </div>

    <div style="position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">

        <!-- Logo -->
        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:64px;height:64px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 32px rgba(99,102,241,0.4);">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
            </div>
            <h1 style="font-size:1.5rem;font-weight:800;color:white;letter-spacing:-0.02em;">RemoteLink</h1>
            <p style="font-size:0.8rem;color:#6b7280;margin-top:4px;">Control your PC from anywhere</p>
        </div>

        <!-- Card -->
        <div class="glass" style="width:100%;max-width:420px;border-radius:24px;padding:36px;">

            <h2 style="font-size:1.3rem;font-weight:700;color:white;margin-bottom:4px;text-align:center;">Create Account</h2>
            <p style="font-size:0.8rem;color:#6b7280;text-align:center;margin-bottom:28px;">Join RemoteLink — it's free to start</p>

            <!-- Error Banner -->
            <div id="error-box" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:0.78rem;color:#fca5a5;text-align:center;"></div>
            <!-- Success Banner -->
            <div id="success-box" style="display:none;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:0.78rem;color:#86efac;text-align:center;"></div>

            <form id="register-form" onsubmit="submitRegister(event)">
                <!-- Full Name -->
                <div style="margin-bottom:16px;">
                    <label style="font-size:0.72rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe"
                        style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white;font-size:0.9rem;transition:all 0.2s;">
                </div>

                <!-- Email -->
                <div style="margin-bottom:16px;">
                    <label style="font-size:0.72rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com"
                        style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white;font-size:0.9rem;transition:all 0.2s;">
                </div>

                <!-- Password -->
                <div style="margin-bottom:16px;">
                    <label style="font-size:0.72rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:8px;">Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" required minlength="6" placeholder="Min. 6 characters"
                            style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:white;font-size:0.9rem;transition:all 0.2s;padding-right:48px;">
                        <button type="button" onclick="togglePw()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7280;cursor:pointer;font-size:0.9rem;">👁</button>
                    </div>
                </div>

                <!-- Free Plan Info Box -->
                <div style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:flex-start;gap:10px;">
                    <span style="font-size:1rem;flex-shrink:0;">ℹ️</span>
                    <div>
                        <p style="font-size:0.75rem;color:#93c5fd;font-weight:600;margin-bottom:2px;">Free Account</p>
                        <p style="font-size:0.72rem;color:#6b7280;">You get 5-minute sessions for free. Upgrade to Premium anytime for unlimited access.</p>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="submit-btn" class="btn-primary" style="width:100%;padding:14px;border-radius:12px;border:none;color:white;font-size:0.9rem;font-weight:700;cursor:pointer;">
                    Create Account →
                </button>
            </form>

            <div style="text-align:center;margin-top:20px;font-size:0.8rem;color:#6b7280;">
                Already have an account?
                <a href="/login.html" style="color:#60a5fa;font-weight:500;text-decoration:none;margin-left:4px;">Sign in</a>
            </div>
        </div>

        <!-- Footer -->
        <div style="margin-top:24px;font-size:0.65rem;color:#374151;font-family:monospace;letter-spacing:0.1em;text-transform:uppercase;">
            Developed by Shiv Shankar
        </div>
    </div>

    <script>
        const API = 'https://remotelink-relay.onrender.com';

        function togglePw() {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        }

        async function submitRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-box');
            const successBox = document.getElementById('success-box');
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.textContent = 'Creating account...';
            btn.disabled = true;

            try {
                const res = await fetch(API + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Registration failed.');
                }

                successBox.textContent = '✅ Account created! Redirecting to login...';
                successBox.style.display = 'block';

                setTimeout(() => window.location.replace('/login.html'), 2000);
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                btn.textContent = 'Create Account →';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
